name: UI-Screenshots aufräumen

on:
  pull_request:
    types:
      - closed

permissions:
  contents: write

jobs:
  cleanup:
    # Screenshot branches only exist for pull requests from this repository.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Screenshot-Branch löschen
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/ui-screenshots-pr-$PR_NUMBER" \
            || echo "Kein Screenshot-Branch für PR #$PR_NUMBER."
