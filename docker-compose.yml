services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: fff_test
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      retries: 10

  web:
    # Built once and cached, so the MySQL extension is not recompiled on every start.
    build:
      dockerfile_inline: |
        FROM php:8.4-cli
        RUN docker-php-ext-install pdo_mysql
    depends_on:
      db:
        condition: service_healthy
    working_dir: /app
    environment:
      FFF_CONFIG: /app/tests/config.php
      DB_DSN: "mysql:host=db;port=3306;dbname=fff_test;charset=utf8mb4"
    ports:
      - "8123:8123"
    volumes:
      - .:/app
    command: sh -c "php tools/seed-local.php && php -S 0.0.0.0:8123 -t public"
